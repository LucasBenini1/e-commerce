<section class="container">
  <div class="fetchDisplay">
    @if(isLoading()){
      <p>Loading...</p>
    }@else{
        @for(item of data(); track $index){
            <div class="itemsContainer" (click)="handleItemClick(item)">
                <h2>{{ item.name }}</h2>
                <p>{{ item.description }}</p>
            </div>
        }
    }
  </div>
</section>
