@if (statusCart()) {
    <div class="container" #cart>
        <button class="close-btn" (click)="closeCart()">✕</button>
        <h2 class="title">Meu Carrinho</h2>
        <ul class="cart-list">
            @for (product of uniqueItems(); track product.item.id) {
                <li class="cart-item">
                    <div class="product-info">
                        <h4>{{ product.item.name }}</h4>
                        <span class="product-price">R$ {{ product.item.price }}</span>
                    </div>
                    <div class="product-quantity">
                        <span>x{{ product.quantity }}</span>
                    </div>
                </li>
            } @empty {
                <p>Seu carrinho está vazio.</p>
            }
        </ul>
        @if (uniqueItems().length > 0) {
            <a routerLink="/checkout" class="checkout-btn" (click)="closeCart()">
                Finalizar Compra
            </a>
        }
        <button class="clear-btn" (click)="clearCart()">
            Limpar Carrinho
        </button>
    </div>
}
